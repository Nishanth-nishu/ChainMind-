name: Build & Push Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'chainmind/**'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: docker.io
  IMAGE: nishanthr23/chainmind

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          # Opt into Node.js 24 to silence deprecation warnings
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

      - name: Check Docker Hub secrets are configured
        id: secrets_check
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::warning::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret is not set."
            echo "::warning::To enable Docker push, go to:"
            echo "::warning::  GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "::warning::  Add: DOCKERHUB_USERNAME = nishanthr23"
            echo "::warning::  Add: DOCKERHUB_TOKEN = <your Docker Hub access token>"
            echo "secrets_ok=false" >> $GITHUB_OUTPUT
          else
            echo "secrets_ok=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.secrets_check.outputs.secrets_ok == 'true'
        uses: docker/setup-buildx-action@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

      - name: Log in to Docker Hub
        if: steps.secrets_check.outputs.secrets_ok == 'true'
        uses: docker/login-action@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          DATE_TAG=$(date +%Y%m%d)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "full_tag=${IMAGE}:${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push
        if: steps.secrets_check.outputs.secrets_ok == 'true'
        uses: docker/build-push-action@v6
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.date_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Skip notice (no secrets)
        if: steps.secrets_check.outputs.secrets_ok == 'false'
        run: |
          echo "::notice::Docker push skipped — DOCKERHUB secrets not configured."
          echo "::notice::Add DOCKERHUB_USERNAME + DOCKERHUB_TOKEN in repo secrets to enable."

      - name: Image digest
        if: steps.secrets_check.outputs.secrets_ok == 'true'
        run: echo "Image pushed — ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}"

      - name: Post pull instructions
        if: steps.secrets_check.outputs.secrets_ok == 'true'
        run: |
          echo "::notice::Pull on any SLURM node:"
          echo "::notice::  singularity pull docker://${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}"
          echo "::notice::  singularity exec --nv chainmind_latest.sif bash run_full_selfcontained.sh"
