name: Build & Push Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'chainmind/**'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: docker.io
  IMAGE: nishanthr23/chainmind

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Use GPU runner if available; fall back to CPU (GPU required only at runtime)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          DATE_TAG=$(date +%Y%m%d)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "full_tag=${IMAGE}:${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.date_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Image digest
        run: echo "Image pushed — ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}"

      - name: Post pull instructions
        run: |
          echo "::notice::Pull on any SLURM node:"
          echo "::notice::  singularity pull docker://${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}"
          echo "::notice::  singularity exec --nv chainmind_latest.sif bash run_full_selfcontained.sh"
